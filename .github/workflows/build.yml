name: build

on:
  push:
    branches: [master]
    paths-ignore:
      - 'os-image/**'
      - 'scripts/**'
  pull_request:
    paths-ignore:
      - 'os-image/**'
      - 'scripts/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cocoon-macos
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Build (all packages, both GOOS)
        env:
          CGO_ENABLED: '0'
        run: |
          GOOS=linux GOARCH=amd64 go build ./...
          GOOS=darwin GOARCH=arm64 go build ./...
          GOOS=linux GOARCH=amd64 go build -o cocoon-macos .

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: cocoon-macos-linux-amd64
          path: cocoon-macos
          retention-days: 30
